mcp: "1"
info:
  name: echo
  version: 1.0.0
tools:
  echo:
    title: Echo
    description: Echo a message.
    annotations:
      readOnlyHint: true
      destructiveHint: false
    input:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
    output:
      type: object
      required: [message]
      properties:
        message:
          type: string
